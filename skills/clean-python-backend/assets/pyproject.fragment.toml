# Fragment for pyproject.toml. Replace {{pkg}}; delete the plugin lines if the project has no optional modules.

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]  # Alembic-generated

[tool.ruff.lint]
# Preview is opt-in per rule: only the pydoclint (DOC) codes listed below run in preview.
preview = true
explicit-preview-rules = true
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "TID251",
    "D",       # Google-style docstrings (pydocstyle)
    # Args/Returns/Yields/Raises match the code. DOC502 is off: Raises also lists what callees raise.
    "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501",
    "ANN401",  # no bare `Any` in signatures
]
ignore = [
    "D105",  # magic methods document themselves
    "D107",  # __init__ arguments go in the class docstring's Args
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Dependency direction: plugins depend on {{pkg}}, never the reverse.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"plugins".msg = "{{pkg}} must not import plugins; enable them through settings."

[tool.ruff.lint.per-file-ignores]
"plugins/**" = ["TID251"]
"tests/**" = ["D", "DOC"]  # test names state the behaviour

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "bedrock.testing"]  # register before conftest imports it, so assertions get rewritten
markers = [
    "real_commits: commit for real instead of rolling back; the test cleans up after itself",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["{{pkg}}", "tests"]
exclude = ["^{{pkg}}/migrations/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
