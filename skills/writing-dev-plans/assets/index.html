<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan Viewer 方案目录">
  <title>方案 · Plan Viewer</title>
  <script src="/assets/viewer-theme.js"></script>
  <link rel="stylesheet" href="/assets/viewer.css">
</head>
<body>
  <header class="appbar">
    <a class="brand" href="/" aria-label="Plan Viewer 首页">
      <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M4 4h22v22H4zM9 9h12v12H9zM15 2v26M2 15h26"/></svg>
      <span>PLAN VIEWER</span>
    </a>
    <div class="crumbs"><b>.plans/</b></div>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="切换到浅色主题">
      <span class="mode mode-dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>暗色</span>
      <span class="mode mode-light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>浅色</span>
    </button>
  </header>

  <main class="page">
    <header class="page-head">
      <h1>方案</h1>
      <p>从当前 worktree 的 <code>.plans/</code> 读取。查看决策、实现与执行进度；原文 Markdown 始终是唯一事实来源。</p>
    </header>
    <div class="register-path"><span>.plans/</span><span id="count">…</span></div>
    <nav class="plan-list" id="plans" aria-label="全部方案" aria-live="polite"><div class="empty"><p>加载中…</p></div></nav>
  </main>

  <footer class="statusbar">
    <span class="source-state"><i aria-hidden="true"></i>MARKDOWN · READ ONLY</span>
    <span id="st-plans">—</span>
    <span id="st-doing">—</span>
    <span id="st-todo">—</span>
  </footer>

  <script type="module">
    import { badge, esc, getJSON, subscribe, tone } from '/assets/common.mjs';

    const container = document.querySelector('#plans');
    const text = (id, value) => { document.getElementById(id).textContent = value; };

    function card(plan, index) {
      const counts = plan.impl?.counts ?? {};
      const total = Object.values(counts).reduce((sum, n) => sum + n, 0);
      const done = counts.done ?? 0, doing = counts.doing ?? 0;
      const note = !total ? '没有任务' : done === total ? '全部完成' : doing ? `${doing} 个进行中` : done ? `${total - done} 个未完成` : '等待执行';
      const formats = [...new Set([plan.plan?.format, plan.impl?.format].filter(Boolean))];
      const badges = [
        badge(`PLAN · ${plan.plan?.status || 'unavailable'}`, tone(plan.plan?.status)),
        badge(`IMPL · ${plan.impl?.status || 'unavailable'}`, tone(plan.impl?.status)),
        plan.impl?.execution ? badge(plan.impl.execution, 'accent') : '',
        ...formats.map(format => badge(`format ${format}${format === 1 ? ' · legacy' : ''}`, '')),
        ...[['needs-user', plan.flags.needsUser], ['blocked', plan.flags.blocked], ['running', plan.flags.running]].filter(([, n]) => n > 0).map(([label, n]) => badge(`${label} · ${n}`, 'warn')),
        ...(plan.visuals.length
          ? plan.visuals.map(visual => badge(`Visual ${visual.file.replace(/^visual-|\.html$/g, '')} · ${visual.state}`, tone(visual.state)))
          : [badge('Visual 未生成', '')]),
      ].join('');
      return `<a class="plan" href="/p/${encodeURIComponent(plan.dir)}" aria-label="打开 ${esc(plan.title || plan.dir)}">
        <span class="plan-id">P–${String(index + 1).padStart(3, '0')}</span>
        <div>
          <h2>${esc(plan.title || plan.dir)}</h2>
          <p class="plan-path">${esc(plan.dir)}</p>
          <time class="plan-path"${plan.date ? ` datetime="${esc(plan.date)}"` : ''}>${esc(plan.date || 'No date')}</time>
        </div>
        <div class="badges plan-state">${badges}</div>
        <div class="plan-progress">
          <div><span>TASKS</span><strong>${done} / ${total}</strong></div>
          <div class="meter" role="progressbar" aria-label="任务完成度" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><b style="--value:${total ? done / total : 0}"></b></div>
          <small>${note}</small>
        </div>
      </a>`;
    }

    let request = 0;
    async function refresh() {
      const current = ++request;
      try {
        const plans = await getJSON('/api/plans');
        if (current !== request) return;
        const sum = key => plans.reduce((n, plan) => n + (plan.impl?.counts?.[key] ?? 0), 0);
        const label = `${plans.length} plan${plans.length === 1 ? '' : 's'}`;
        text('count', label); text('st-plans', label); text('st-doing', `${sum('doing')} doing`); text('st-todo', `${sum('todo')} todo`);
        container.innerHTML = plans.length ? plans.map(card).join('') : '<div class="empty"><h2>还没有方案</h2><p>运行 <code>new-plan.sh</code> 创建一个。</p></div>';
      } catch (error) {
        if (current === request) container.innerHTML = `<div class="empty"><h2>无法加载方案</h2><p>${esc(error.message)}</p></div>`;
      }
    }
    subscribe(() => void refresh());
    void refresh();
  </script>
</body>
</html>
