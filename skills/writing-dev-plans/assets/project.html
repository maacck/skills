<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan Viewer 单方案阅读页">
  <title>Plan Viewer · 方案</title>
  <script src="/assets/viewer-theme.js"></script>
  <link rel="stylesheet" href="/assets/viewer.css">
</head>
<body data-panel="plan">
  <header class="appbar">
    <a class="brand" href="/" aria-label="返回方案目录">
      <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M4 4h22v22H4zM9 9h12v12H9zM15 2v26M2 15h26"/></svg>
      <span>PLAN VIEWER</span>
    </a>
    <div class="crumbs"><a href="/">.plans</a> › <span id="crumb-dir"></span> › <b id="crumb-file">plan.md</b></div>
    <select class="look" id="look" aria-label="Mermaid 风格"><option value="neo">mermaid · neo</option><option value="handDrawn">mermaid · handDrawn</option></select>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="切换到浅色主题">
      <span class="mode mode-dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>暗色</span>
      <span class="mode mode-light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>浅色</span>
    </button>
  </header>

  <div class="shell">
    <nav class="tabs" role="tablist" aria-label="方案视图">
      <button class="tab" id="tab-plan" role="tab" data-tab="plan" aria-selected="true" aria-controls="panel-plan">Plan <span id="count-plan"></span></button>
      <button class="tab" id="tab-impl" role="tab" data-tab="impl" aria-selected="false" aria-controls="panel-impl" tabindex="-1">Impl <span id="count-impl"></span></button>
      <button class="tab" id="tab-progress" role="tab" data-tab="progress" aria-selected="false" aria-controls="panel-progress" tabindex="-1">Progress <span id="count-progress"></span></button>
      <button class="tab" id="tab-visual" role="tab" data-tab="visual" aria-selected="false" aria-controls="panel-visual" tabindex="-1">Visual <span id="count-visual"></span></button>
    </nav>

    <main class="sheet">
      <header class="project-head">
        <h1 id="title">Plan Viewer</h1>
        <p id="meta"></p>
        <div class="badges" id="head-badges"></div>
      </header>
      <div id="lint"></div>
      <section class="panel" id="panel-plan" role="tabpanel" aria-labelledby="tab-plan"></section>
      <section class="panel" id="panel-impl" role="tabpanel" aria-labelledby="tab-impl" hidden></section>
      <section class="panel" id="panel-progress" role="tabpanel" aria-labelledby="tab-progress" hidden></section>
      <section class="panel" id="panel-visual" role="tabpanel" aria-labelledby="tab-visual" hidden></section>
    </main>
  </div>

  <footer class="statusbar">
    <span class="source-state"><i aria-hidden="true"></i>MARKDOWN · READ ONLY</span>
    <span id="st-dir"></span>
    <span id="st-status"></span>
    <span id="st-tasks"></span>
  </footer>

  <script type="module" src="/assets/project.mjs"></script>
</body>
</html>
